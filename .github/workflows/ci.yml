name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=docker depName=renovate/renovate
  RENOVATE_IMAGE: renovate/renovate:44.181.7@sha256:4f5a2621afd6629fda621e5c66221d1000f0ef3330ec14c828d7e8d357f03522

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks the workflows themselves: expressions, inputs, shell in run.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      # Security audit of the workflows, for example template injection or
      # credentials left in the checkout. Informational findings do not fail.
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          min-severity: low
          version: 1.31.1

  # The preset and the repo config must pass the validator without a
  # migration hint, or every repo that extends the preset breaks.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: renovate-config-validator
        run: >-
          docker run --rm -v "$PWD":/work -w /work
          --entrypoint renovate-config-validator "$RENOVATE_IMAGE"
          --strict --no-global default.json renovate.json
